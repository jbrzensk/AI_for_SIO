<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="title">Good, better, best: each version adds one of the four parts</title>
  <desc id="desc">Three versions of a paper-summary prompt, colour-coded by part. Good: "Summarize this paper" is only a goal. Better: "Summarize" (goal) "the question, methods, data, and findings" (context) "for an ocean scientist" (output), so it adds context and output. Best: "Use only the attached paper. Separate the authors' claims from your interpretation" (boundaries), "list three limitations" (output), "and cite page or section locations" (boundaries), so it adds boundaries. Best isn't just longer: its boundaries make the answer easier to check.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="358" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="2"/>

  <!-- legend -->
  <text x="24" y="38" font-size="12" fill="#59636e">Each colour is one of the four parts:</text>
  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="270" y="23" width="56" height="22" rx="11" fill="#ddf4ff" stroke="#0969da"/><text x="298" y="38" fill="#0969da">Goal</text>
    <rect x="336" y="23" width="74" height="22" rx="11" fill="#dafbe1" stroke="#1a7f37"/><text x="373" y="38" fill="#1a7f37">Context</text>
    <rect x="420" y="23" width="66" height="22" rx="11" fill="#fbefff" stroke="#8250df"/><text x="453" y="38" fill="#8250df">Output</text>
    <rect x="496" y="23" width="94" height="22" rx="11" fill="#fff1e5" stroke="#bc4c00"/><text x="543" y="38" fill="#bc4c00">Boundaries</text>
  </g>
  <line x1="24" y1="58" x2="696" y2="58" stroke="#d1d9e0"/>

  <!-- ladder labels -->
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#1f2328">
    <rect x="24" y="76" width="80" height="30" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/><text x="64" y="96">Good</text>
    <rect x="24" y="144" width="80" height="30" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/><text x="64" y="164">Better</text>
    <rect x="24" y="230" width="80" height="30" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-width="2"/><text x="64" y="250">Best</text>
  </g>
  <g stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="64" y1="108" x2="64" y2="140"/><line x1="64" y1="176" x2="64" y2="226"/>
  </g>

  <!-- prompts, colour-coded by part -->
  <g font-size="14" fill="#1f2328">
    <text x="124" y="96"><tspan fill="#0969da" font-weight="600" text-decoration="underline">Summarize this paper.</tspan></text>

    <text x="124" y="164"><tspan fill="#0969da" font-weight="600" text-decoration="underline">Summarize</tspan> <tspan fill="#1a7f37" font-weight="600" text-decoration="underline">the question, methods, data, and findings</tspan></text>
    <text x="124" y="185"><tspan fill="#8250df" font-weight="600" text-decoration="underline">for an ocean scientist.</tspan></text>

    <text x="124" y="250"><tspan fill="#bc4c00" font-weight="600" text-decoration="underline">Use only the attached paper. Separate the authors' claims</tspan></text>
    <text x="124" y="271"><tspan fill="#bc4c00" font-weight="600" text-decoration="underline">from your interpretation,</tspan> <tspan fill="#8250df" font-weight="600" text-decoration="underline">list three limitations,</tspan> and <tspan fill="#bc4c00" font-weight="600" text-decoration="underline">cite</tspan></text>
    <text x="124" y="292"><tspan fill="#bc4c00" font-weight="600" text-decoration="underline">page or section locations.</tspan></text>
  </g>

  <!-- what each step adds -->
  <g font-size="12" font-weight="600" text-anchor="middle">
    <text x="650" y="76" font-size="11" font-weight="400" fill="#59636e">adds</text>
    <rect x="604" y="82" width="92" height="22" rx="11" fill="#ddf4ff" stroke="#0969da"/><text x="650" y="97" fill="#0969da">Goal</text>
    <rect x="604" y="150" width="92" height="22" rx="11" fill="#dafbe1" stroke="#1a7f37"/><text x="650" y="165" fill="#1a7f37">+ Context</text>
    <rect x="604" y="178" width="92" height="22" rx="11" fill="#fbefff" stroke="#8250df"/><text x="650" y="193" fill="#8250df">+ Output</text>
    <rect x="604" y="236" width="92" height="22" rx="11" fill="#fff1e5" stroke="#bc4c00"/><text x="650" y="251" fill="#bc4c00">+ Boundaries</text>
  </g>

  <text x="360" y="336" text-anchor="middle" font-size="12" fill="#59636e">"Best" isn't just longer: its boundaries make the answer easier to check.</text>
</svg>
