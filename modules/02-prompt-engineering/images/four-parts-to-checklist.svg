<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="title">The four parts map onto the five-step checklist</title>
  <desc id="desc">Left, the four parts for any prompt: Goal, Context, Output, Boundaries. Right, the five-step checklist for real research prompts: 1 Goal, 2 Evidence, 3 Output, 4 Check, 5 Confirm. Goal maps to Goal, Context maps to Evidence, Output maps to Output, and Boundaries splits into Check (what to verify afterwards) and Confirm (what needs your sign-off).</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="398" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="2"/>

  <g text-anchor="middle">
    <text x="150" y="34" font-size="15" font-weight="600" fill="#1f2328">The four parts</text>
    <text x="150" y="52" font-size="12" fill="#59636e">for any prompt</text>
    <text x="570" y="34" font-size="15" font-weight="600" fill="#1f2328">The five-step checklist</text>
    <text x="570" y="52" font-size="12" fill="#59636e">for real research prompts</text>
  </g>

  <!-- four parts -->
  <g font-size="12">
    <rect x="20" y="72" width="260" height="58" rx="8" fill="#ddf4ff" stroke="#0969da"/>
    <text x="34" y="96" font-size="15" font-weight="600" fill="#0969da">Goal</text>
    <text x="34" y="116" fill="#1f2328">what should the model actually do?</text>
    <rect x="20" y="148" width="260" height="58" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="34" y="172" font-size="15" font-weight="600" fill="#1a7f37">Context</text>
    <text x="34" y="192" fill="#1f2328">evidence, files, key assumptions</text>
    <rect x="20" y="224" width="260" height="58" rx="8" fill="#fbefff" stroke="#8250df"/>
    <text x="34" y="248" font-size="15" font-weight="600" fill="#8250df">Output</text>
    <text x="34" y="268" fill="#1f2328">form, length, and audience</text>
    <rect x="20" y="300" width="260" height="58" rx="8" fill="#fff1e5" stroke="#bc4c00"/>
    <text x="34" y="324" font-size="15" font-weight="600" fill="#bc4c00">Boundaries</text>
    <text x="34" y="344" fill="#1f2328">fixed, verified, or still a draft?</text>
  </g>

  <!-- five steps -->
  <g font-size="12">
    <rect x="440" y="72" width="260" height="50" rx="8" fill="#ddf4ff" stroke="#0969da"/>
    <text x="454" y="93" font-size="14" font-weight="600" fill="#0969da">1  Goal</text>
    <text x="454" y="111" fill="#1f2328">the result, and who it's for</text>
    <rect x="440" y="134" width="260" height="50" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="454" y="155" font-size="14" font-weight="600" fill="#1a7f37">2  Evidence</text>
    <text x="454" y="173" fill="#1f2328">files or sources that matter</text>
    <rect x="440" y="196" width="260" height="50" rx="8" fill="#fbefff" stroke="#8250df"/>
    <text x="454" y="217" font-size="14" font-weight="600" fill="#8250df">3  Output</text>
    <text x="454" y="235" fill="#1f2328">format and real constraints</text>
    <rect x="440" y="258" width="260" height="50" rx="8" fill="#fff1e5" stroke="#bc4c00"/>
    <text x="454" y="279" font-size="14" font-weight="600" fill="#bc4c00">4  Check</text>
    <text x="454" y="297" fill="#1f2328">numbers, units, citations to verify</text>
    <rect x="440" y="320" width="260" height="50" rx="8" fill="#fff1e5" stroke="#bc4c00"/>
    <text x="454" y="341" font-size="14" font-weight="600" fill="#bc4c00">5  Confirm</text>
    <text x="454" y="359" fill="#1f2328">assumptions and logic you sign off</text>
  </g>

  <!-- mapping -->
  <g fill="none" stroke-width="2">
    <path d="M282,101 C360,101 360,97 436,97" stroke="#0969da" marker-end="url(#ab)"/>
    <path d="M282,177 C360,177 360,159 436,159" stroke="#1a7f37" marker-end="url(#ag)"/>
    <path d="M282,253 C360,253 360,221 436,221" stroke="#8250df" marker-end="url(#ap)"/>
    <path d="M282,329 C360,329 360,283 436,283" stroke="#bc4c00" marker-end="url(#ao)"/>
    <path d="M282,329 C360,329 360,345 436,345" stroke="#bc4c00" marker-end="url(#ao)"/>
  </g>

  <text x="360" y="390" text-anchor="middle" font-size="12" fill="#59636e">Context becomes Evidence; Boundaries splits into Check (verify after) and Confirm (your sign-off).</text>
</svg>
