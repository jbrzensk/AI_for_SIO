<svg xmlns="http://www.w3.org/2000/svg" width="728" height="333" viewBox="0 0 520 238" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="title">How a prompt becomes a response</title>
  <desc id="desc">The prompt "What color is the sky?" goes through four steps. 1, Tokens: the text is split into pieces (What, color, is, the, sky, question mark) and each gets a number. 2, Embeddings: each token becomes a list of numbers. 3, Attention: the model works out which tokens matter to each other, for example sky and color. 4, Prediction: the model scores possible next tokens, such as Blue, The, or It, and picks a likely one. No step looks anything up; every word is predicted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker>
  </defs>
  <rect x="1" y="1" width="518" height="236" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#1f2328">"What color is the sky?"</text>
  <line x1="260" y1="31" x2="260" y2="49" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g font-size="12">
    <!-- 1 Tokens -->
    <rect x="12" y="55" width="116" height="132" rx="8" fill="#ddf4ff" stroke="#0969da"/>
    <text x="70" y="74" text-anchor="middle" font-weight="600" fill="#0969da">1 Tokens</text>
    <g fill="#1f2328" text-anchor="middle">
      <rect x="22" y="84" width="44" height="20" rx="4" fill="#ffffff" stroke="#0969da"/><text x="44" y="98">What</text>
      <rect x="72" y="84" width="46" height="20" rx="4" fill="#ffffff" stroke="#0969da"/><text x="95" y="98">color</text>
      <rect x="22" y="110" width="28" height="20" rx="4" fill="#ffffff" stroke="#0969da"/><text x="36" y="124">is</text>
      <rect x="56" y="110" width="32" height="20" rx="4" fill="#ffffff" stroke="#0969da"/><text x="72" y="124">the</text>
      <rect x="94" y="110" width="24" height="20" rx="4" fill="#ffffff" stroke="#0969da"/><text x="106" y="124">?</text>
      <rect x="22" y="136" width="34" height="20" rx="4" fill="#ffffff" stroke="#0969da"/><text x="39" y="150">sky</text>
    </g>
    <text x="70" y="177" text-anchor="middle" fill="#59636e" font-size="10">each gets a number</text>
    <line x1="130" y1="121" x2="140" y2="121" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- 2 Embeddings -->
    <rect x="142" y="55" width="118" height="132" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="201" y="74" text-anchor="middle" font-weight="600" fill="#1a7f37">2 Embeddings</text>
    <rect x="156" y="88" width="90" height="12" fill="#1a7f37" opacity="0.25"/><rect x="156" y="88" width="30" height="12" fill="#1a7f37" opacity="0.65"/>
    <rect x="156" y="106" width="90" height="12" fill="#1a7f37" opacity="0.25"/><rect x="196" y="106" width="22" height="12" fill="#1a7f37" opacity="0.65"/>
    <rect x="156" y="124" width="90" height="12" fill="#1a7f37" opacity="0.25"/><rect x="170" y="124" width="40" height="12" fill="#1a7f37" opacity="0.65"/>
    <text x="201" y="161" text-anchor="middle" fill="#59636e" font-size="10">each token becomes</text>
    <text x="201" y="174" text-anchor="middle" fill="#59636e" font-size="10">a list of numbers</text>
    <line x1="262" y1="121" x2="272" y2="121" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- 3 Attention -->
    <rect x="274" y="55" width="118" height="132" rx="8" fill="#fff8c5" stroke="#9a6700"/>
    <text x="333" y="74" text-anchor="middle" font-weight="600" fill="#9a6700">3 Attention</text>
    <g fill="#9a6700" text-anchor="middle" font-size="11">
      <text x="298" y="106">sky</text><text x="368" y="106">color</text>
      <path d="M311,101 Q333,84 351,101" fill="none" stroke="#9a6700" stroke-width="2.5"/>
      <text x="298" y="136">the</text><text x="368" y="136">sky</text>
      <path d="M311,131 Q333,121 354,131" fill="none" stroke="#9a6700" stroke-width="1" opacity="0.6"/>
    </g>
    <text x="333" y="161" text-anchor="middle" fill="#59636e" font-size="10">which tokens matter</text>
    <text x="333" y="174" text-anchor="middle" fill="#59636e" font-size="10">to each other</text>
    <line x1="394" y1="121" x2="404" y2="121" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- 4 Prediction -->
    <rect x="406" y="55" width="102" height="132" rx="8" fill="#ffebe9" stroke="#cf222e"/>
    <text x="457" y="74" text-anchor="middle" font-weight="600" fill="#cf222e">4 Prediction</text>
    <g font-size="11" fill="#1f2328">
      <text x="416" y="99">Blue</text><rect x="446" y="90" width="52" height="10" fill="#cf222e" opacity="0.7"/>
      <text x="416" y="119">The</text><rect x="446" y="110" width="14" height="10" fill="#cf222e" opacity="0.4"/>
      <text x="416" y="139">It</text><rect x="446" y="130" width="9" height="10" fill="#cf222e" opacity="0.4"/>
    </g>
    <text x="457" y="161" text-anchor="middle" fill="#59636e" font-size="10">most likely</text>
    <text x="457" y="174" text-anchor="middle" fill="#59636e" font-size="10">next token</text>
  </g>
  <text x="260" y="218" text-anchor="middle" font-size="12" fill="#59636e">No step looks anything up; every word is predicted.</text>
</svg>
