<svg xmlns="http://www.w3.org/2000/svg" width="720" height="338" viewBox="0 0 720 338" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">
  <title id="title">Three ways of reasoning</title>
  <desc id="desc">Three panels. Deductive, general to specific: the rule "All mammals breathe air" and the case "Dolphins are mammals" lead down to "Dolphins breathe air"; certain if the premises are true; in LLMs, running code or a formal proof. Inductive, specific to general: four white swans seen lead up to "Probably all swans are white"; likely, not guaranteed; in LLMs, how the model was trained. Abductive, observation to best explanation: "The grass is wet" has candidate explanations rain, sprinkler, and dew, and the simplest, rain, is picked; a best guess, not a proof; in LLMs, explaining or diagnosing something new.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="336" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="2"/>

  <!-- Deductive -->
  <rect x="12" y="12" width="228" height="314" rx="10" fill="#ddf4ff" stroke="#0969da"/>
  <text x="126" y="38" font-size="16" font-weight="600" fill="#0969da">Deductive</text>
  <text x="126" y="56" font-size="12" fill="#59636e">general → specific</text>
  <g font-size="12" fill="#1f2328">
    <rect x="26" y="72" width="200" height="28" rx="6" fill="#ffffff" stroke="#0969da"/><text x="126" y="91">All mammals breathe air</text>
    <rect x="26" y="108" width="200" height="28" rx="6" fill="#ffffff" stroke="#0969da"/><text x="126" y="127">Dolphins are mammals</text>
    <line x1="126" y1="138" x2="126" y2="160" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="26" y="164" width="200" height="30" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="2"/><text x="126" y="184" font-weight="600">∴ Dolphins breathe air</text>
  </g>
  <text x="126" y="226" font-size="12" fill="#1f2328">Certain, if the premises are true</text>
  <rect x="28" y="234" width="196" height="10" rx="5" fill="#ffffff" stroke="#0969da" stroke-width="0.5"/>
  <rect x="28" y="234" width="196" height="10" rx="5" fill="#0969da"/>
  <line x1="26" y1="258" x2="226" y2="258" stroke="#0969da" stroke-opacity="0.35"/>
  <text x="126" y="280" font-size="12" font-weight="600" fill="#59636e">In LLMs</text>
  <text x="126" y="298" font-size="12" fill="#59636e">running code or a formal proof</text>

  <!-- Inductive -->
  <rect x="246" y="12" width="228" height="314" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="360" y="38" font-size="16" font-weight="600" fill="#1a7f37">Inductive</text>
  <text x="360" y="56" font-size="12" fill="#59636e">specific → general</text>
  <g font-size="12" fill="#1f2328">
    <rect x="256" y="72" width="208" height="30" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><text x="360" y="91" font-size="11" font-weight="600">∴ Probably all swans are white</text>
    <g stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)">
      <line x1="284" y1="154" x2="336" y2="106"/><line x1="334" y1="154" x2="352" y2="106"/>
      <line x1="386" y1="154" x2="368" y2="106"/><line x1="436" y1="154" x2="384" y2="106"/>
    </g>
    <g font-size="11">
      <rect x="262" y="156" width="44" height="22" rx="11" fill="#ffffff" stroke="#1a7f37"/><text x="284" y="171">white</text>
      <rect x="312" y="156" width="44" height="22" rx="11" fill="#ffffff" stroke="#1a7f37"/><text x="334" y="171">white</text>
      <rect x="364" y="156" width="44" height="22" rx="11" fill="#ffffff" stroke="#1a7f37"/><text x="386" y="171">white</text>
      <rect x="414" y="156" width="44" height="22" rx="11" fill="#ffffff" stroke="#1a7f37"/><text x="436" y="171">white</text>
    </g>
    <text x="360" y="196" font-size="11" fill="#59636e">every swan I've seen</text>
  </g>
  <text x="360" y="226" font-size="12" fill="#1f2328">Likely, not guaranteed</text>
  <rect x="262" y="234" width="196" height="10" rx="5" fill="#ffffff" stroke="#1a7f37" stroke-width="0.5"/>
  <rect x="262" y="234" width="130" height="10" rx="5" fill="#1a7f37"/>
  <line x1="260" y1="258" x2="460" y2="258" stroke="#1a7f37" stroke-opacity="0.35"/>
  <text x="360" y="280" font-size="12" font-weight="600" fill="#59636e">In LLMs</text>
  <text x="360" y="298" font-size="12" fill="#59636e">how the model was trained</text>

  <!-- Abductive -->
  <rect x="480" y="12" width="228" height="314" rx="10" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="594" y="38" font-size="16" font-weight="600" fill="#bc4c00">Abductive</text>
  <text x="594" y="56" font-size="12" fill="#59636e">observation → best explanation</text>
  <g font-size="12" fill="#1f2328">
    <rect x="514" y="72" width="160" height="28" rx="6" fill="#ffffff" stroke="#bc4c00"/><text x="594" y="91">The grass is wet</text>
    <g stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)">
      <line x1="574" y1="102" x2="534" y2="124"/><line x1="594" y1="102" x2="594" y2="124"/><line x1="614" y1="102" x2="654" y2="124"/>
    </g>
    <g font-size="11">
      <rect x="500" y="128" width="64" height="24" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-width="2"/><text x="532" y="144" font-weight="600">rain</text>
      <path d="M550,140 l3,4 l6,-8" fill="none" stroke="#1a7f37" stroke-width="2"/>
      <rect x="568" y="128" width="64" height="24" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-opacity="0.5"/><text x="600" y="144" fill="#59636e">sprinkler</text>
      <rect x="636" y="128" width="58" height="24" rx="12" fill="#ffffff" stroke="#bc4c00" stroke-opacity="0.5"/><text x="665" y="144" fill="#59636e">dew</text>
    </g>
    <line x1="532" y1="154" x2="570" y2="166" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="514" y="168" width="160" height="30" rx="6" fill="#ffffff" stroke="#bc4c00" stroke-width="2"/><text x="594" y="188" font-weight="600">∴ It probably rained</text>
  </g>
  <text x="594" y="226" font-size="12" fill="#1f2328">A best guess, not a proof</text>
  <rect x="496" y="234" width="196" height="10" rx="5" fill="#ffffff" stroke="#bc4c00" stroke-width="0.5"/>
  <rect x="496" y="234" width="66" height="10" rx="5" fill="#bc4c00"/>
  <line x1="494" y1="258" x2="694" y2="258" stroke="#bc4c00" stroke-opacity="0.35"/>
  <text x="594" y="280" font-size="12" font-weight="600" fill="#59636e">In LLMs</text>
  <text x="594" y="298" font-size="12" fill="#59636e">explaining or diagnosing</text>
  <text x="594" y="313" font-size="12" fill="#59636e">something new</text>
</svg>
